name = "group-chat-worker"

main = "index.js"
compatibility_date = "2025-01-15"

# D1 Database binding for group chat
[[d1_databases]]
binding = "CHAT_DB"
database_name = "hallo_vegvisr_chat"
database_id = "1abe2080-33ae-442b-9552-5203caa6c0e0"

[[d1_databases]]
binding = "IDENTITY_DB"
database_name = "vegvisr_org"
database_id = "507d1efd-1dda-45ef-971f-52d2c8e8afe8"

[vars]
ENVIRONMENT = "production"
# Public base for media URLs. Without it, buildMediaUrl derives the origin from
# request.url — which for a worker-to-worker call (the Instagram attachment
# ingest) is the synthetic service-binding host "group-chat-worker", producing
# urls no browser can resolve. Matches what the normal upload path already emits.
PUBLIC_MEDIA_BASE_URL = "https://group-chat-worker.torarnehave.workers.dev/media"
# Sender for every group email alert: post@vegr.ai, sent via email-worker's
# /send-cf-email REST path (Cloudflare's native env.EMAIL.send() binding can
# only send from domains in the SAME Cloudflare account as this worker —
# vegr.ai lives in a different account, so that binding rejects it with
# E_SENDER_DOMAIN_NOT_AVAILABLE regardless of which @vegr.ai address is used).
# These identify the existing cf-email-service account entry in
# config.data.settings.emailAccounts (vegvisr_org DB) that already holds a
# working Cloudflare API token for the vegr.ai account — the same account
# Agent-Builder's send_email tool uses to send from this address today.
# Per-group alert_sender_email is no longer used for sending (an owner-picked
# address isn't guaranteed to be reachable this way either).
ALERT_SENDER_USER_EMAIL = "post@vegr.ai"
ALERT_SENDER_ACCOUNT_ID = "5673fe94-0d29-4b8e-8be6-5362877a3a65"
# INTERNAL_SHARED_SECRET is a secret, not a var. Set it to the SAME value the
# email-worker uses:  npx wrangler secret put INTERNAL_SHARED_SECRET

# Service binding to SMS auth worker
[[services]]
binding = "SMS_WORKER"
service = "sms-gateway"

[[r2_buckets]]
binding = "CHAT_MEDIA"
bucket_name = "hallo-vegvisr-chat-media"

# Service binding to agent-worker for bot responses
[[services]]
binding = "AGENT_WORKER"
service = "agent-worker"

# Service binding to email-worker for owner-sent email alerts
[[services]]
binding = "EMAIL_WORKER"
service = "email-worker"

# Service binding to openai-worker for private voice transcription (audio bytes, no public URL)
[[services]]
binding = "OPENAI_WORKER"
service = "openai-worker"
