name = "knowledge-graph-worker"          # Change this to your desired worker name

main = "index.js"                # Path relative to the wrangler.toml file (here, same folder)
compatibility_date = "2025-02-14"

# Required for Client ID Metadata Documents, which is how an MCP client with no pre-existing
# relationship registers under the 2026 spec. Without it the provider logs
# "CIMD is disabled" at startup and clientIdMetadataDocumentEnabled has no effect — caught from
# the wrangler dev log, not from the docs.
compatibility_flags = ["global_fetch_strictly_public"]

# Optionally, if you plan to deploy to Workers.dev:
workers_dev = true

[ai]
binding = "AI"

# Browser Rendering — a real browser the worker can borrow. Needed because plain fetch()
# gets bot-challenged by Cloudflare (cf-mitigated: challenge -> 403) and cannot run the
# JavaScript that builds modern pages. Used by /renderUrl. No API token required with a
# binding (a REST call would need one scoped Browser Rendering - Edit).
[browser]
binding = "BROWSER"

[[kv_namespaces]]
binding = "BINDING_NAME"
id = "1e3f20b8ed40453dbfa1f771012c99f2"

[[kv_namespaces]]
binding = "THEME_STUDIO_KV"
id = "c1489b0abee34a9d82f326b1b8f89c15"

# Read-only. brand-worker writes html:<hostname> here on every html-node publish;
# this worker reads the registry so graph listings can report which site a graph
# publishes to without trusting the node-level publishedDomain stamp.
# OAuth 2.1 + MCP state, written by @cloudflare/workers-oauth-provider: registered clients,
# grants, authorization codes and tokens (hashed), plus the short-lived OTP challenges bound to
# an in-flight authorization under the oauthtx: prefix.
#
# Created 2026-09-27 with `wrangler kv namespace create OAUTH_KV`. Local `wrangler dev --local`
# fabricates its own storage from the binding name and never touches this namespace.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "62c2d3110e4244daa8be5b31c0e59fd7"

[[kv_namespaces]]
binding = "HTML_PAGES"
id = "2b8ce05731454bcf82b790b91392bee8"

[[d1_databases]]
binding = "vegvisr_org"
database_name = "vegvisr_org"
database_id = "507d1efd-1dda-45ef-971f-52d2c8e8afe8"

# Group chat DB — for the /onboarding/status chat-engagement counts
[[d1_databases]]
binding = "CHAT_DB"
database_name = "hallo_vegvisr_chat"
database_id = "1abe2080-33ae-442b-9552-5203caa6c0e0"

[[services]]
binding = "CHAT_HISTORY_WORKER"
service = "chat-history-worker"

[[services]]
binding = "DRIZZLE_WORKER"
service = "drizzle-worker"

[[services]]
binding = "DASH"
service = "vegvisr-dash-worker"
environment = "production"

[[services]]
binding = "EMAIL_WORKER"
service = "email-worker"

# SMS gateway for the OAuth OTP step. brand-worker binds the same worker as SMS_GATEWAY;
# dev-worker/oauth/otp.js falls back to the public workers.dev URL if this is missing.
[[services]]
binding = "SMS_GATEWAY"
service = "sms-gateway"

# The public origin this worker is reached on. It becomes the OAuth issuer and the RFC 9728
# resource identifier (`<origin>/mcp`), which is the audience of every access token. Override it
# in .dev.vars for local testing; the protected-resource document is only served for a request
# that arrives on this origin.
[vars]
MCP_PUBLIC_ORIGIN = "https://knowledge.vegvisr.org"
# Sends per caller per 24h on the MCP e-mail path. Raised 20 -> 100 on 2026-10-04, a day after
# shipping — hence a var rather than a constant. Counted from email_send_log, so it is a cap on
# what actually went out, not on attempts.
MCP_DAILY_SEND_CAP = "100"

# The chat bot every AI-posted message appears as. Adding this bot to a group is what permits
# post_chat_message to post there, so a group's bot list is the access control — set and revoked
# by a human in the chat app, with no deploy.
# Which chat bot each MCP client posts as, keyed by the HOST of its client id — and only when
# that id is a URL, i.e. a Client ID Metadata Document the provider actually fetched. A client
# registered through /register has an opaque id and a self-chosen name, so it cannot claim a
# named assistant's bot; it falls back to MCP_CHAT_BOT_FALLBACK_USERNAME.
MCP_CHAT_BOT_MAP = """{"chatgpt.com":"chatgpt","claude.ai":"claude","grok.com":"grok"}"""
MCP_CHAT_BOT_FALLBACK_USERNAME = "ai-assistant"

# group-chat-worker, for the MCP post_chat_message tool. brand-worker binds the same worker
# under the same name. Posting goes through its /bot-message endpoint, which checks that the
# BOT is a group member; chat-service.js additionally checks that the CALLER is one.
[[services]]
binding = "CHAT_WORKER"
service = "group-chat-worker"

# photos-worker, for the MCP generate_node_image tool. Its /upload authenticates with
# X-API-Token resolved against config.emailVerificationToken — there is no service-binding trust
# path — so images-service.js reads the authenticated user's own token from D1 and sends it.
# Running as the user is also what routes a World Founder's bytes into their own R2 account.
[[services]]
binding = "PHOTOS_WORKER"
service = "vegvisr-photos-worker"

# agent-worker, for the MCP publish_html_node tool. Publishing is NOT reimplemented here: the
# ~250 lines of rules in agent-worker's executePublishHtmlNode — the wrong-host guard, the
# dead-backend probe, gate and version-pill persistence, which proxy signs the token, the
# read-back verification — each came from a real failure, and a second copy would drift from
# them one bug at a time. This binding is the door to the single implementation.
[[services]]
binding = "AGENT_WORKER"
service = "agent-worker"

# gpt-image-2.5 for reference-image composition, through openai-worker's /images/edits.
# Added 2026-10-01: Workers AI has nothing that preserves a specific subject across a new scene.
[[services]]
binding = "OPENAI_WORKER"
service = "openai-worker"
