# Deploys dev-worker (the MCP server, running as knowledge-graph-worker) from GitHub:
# unit tests → the owner's approval → wrangler deploy → live smoke. The same gate as
# dev-worker/ship.sh, with a person in the middle of it.
#
# WHY THE APPROVAL IS NOT OPTIONAL
# This worker holds the platform database, the chat database, four KV namespaces and ten service
# bindings. Whatever can push to main — including an assistant with GitHub write access — could
# otherwise put code in front of all of that within minutes. So:
#
#   * the deploy job runs in the `mcp-production` environment, which has a required reviewer;
#   * CLOUDFLARE_API_TOKEN exists ONLY as a secret of that environment. It must never be added as
#     a repository secret: a repository secret is readable by any workflow file on main, and
#     removing one line from this file would then skip the approval.
#
# The test job has no secrets and needs no approval, so a red suite never reaches the reviewer.
name: Deploy dev-worker (MCP server)

on:
  push:
    branches: [main]
    paths:
      - 'dev-worker/**'
      - '.github/workflows/deploy-dev-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-dev-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: 1/3 unit tests
        run: node --test dev-worker/test/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: mcp-production
    env:
      CLOUDFLARE_ACCOUNT_ID: 5d9b2060ef095c777711a8649c24914e
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Check the Cloudflare token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Environment secret CLOUDFLARE_API_TOKEN is missing — gh secret set CLOUDFLARE_API_TOKEN --env mcp-production"
            exit 1
          fi

      - name: 2/3 deploy
        working-directory: dev-worker
        run: npx wrangler deploy

      - name: 3/3 live smoke (public checks only — CI holds no session and no D1 access)
        env:
          SMOKE_PUBLIC_ONLY: '1'
        run: node dev-worker/test/smoke-live.mjs
