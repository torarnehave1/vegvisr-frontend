# Deploys seo-worker (SEO pages: seo.vegvisr.org, www.vegvisr.org/graph/*, universi.no/graph/*)
# from GitHub: syntax check → the owner's approval → wrangler deploy → live check.
#
# Same gate as deploy-dev-worker.yml, and for the same reason: the deploy job runs in the
# `mcp-production` environment, which has a required reviewer, and CLOUDFLARE_API_TOKEN exists
# ONLY as a secret of that environment. Never add it as a repository secret.
#
# seo-worker/wrangler.toml is tracked (public repo): binding names, ids and routes only.
name: Deploy seo-worker

on:
  push:
    branches: [main]
    paths:
      - 'seo-worker/**'
      - '.github/workflows/deploy-seo-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-seo-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 1/3 syntax check
        run: node --check seo-worker/index.js

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: mcp-production
    env:
      CLOUDFLARE_ACCOUNT_ID: 5d9b2060ef095c777711a8649c24914e
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Check the Cloudflare token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Environment secret CLOUDFLARE_API_TOKEN is missing — gh secret set CLOUDFLARE_API_TOKEN --env mcp-production"
            exit 1
          fi

      - name: 2/3 deploy
        working-directory: seo-worker
        run: npx wrangler deploy

      - name: 3/3 live check (seo.vegvisr.org answers)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://seo.vegvisr.org/)
          echo "seo.vegvisr.org → HTTP $code"
          case "$code" in 5*|000) echo "::error::seo-worker does not answer after deploy"; exit 1;; esac
