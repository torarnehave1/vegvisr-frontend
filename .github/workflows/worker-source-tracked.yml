# The local hook is opt-in per clone (git config core.hooksPath .githooks), so
# a fresh clone can silently lose it. This runs on every push and PR, where it
# cannot be forgotten.
name: Worker source tracked

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CI runs on a clean checkout, so only the untracked bucket can fire here.
      # The modified-but-uncommitted bucket is enforced by the pre-commit hook,
      # which is the only place a working-tree delta exists.
      - name: Fail if worker source is untracked
        run: ./scripts/check-worker-source-tracked.sh
