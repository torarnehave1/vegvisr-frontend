# Deploys calendar-worker (Google Calendar for ContactHub, bookings and the MCP calendar tools)
# from GitHub: unit tests → the owner's approval → wrangler deploy → what is running.
#
# The worker's source lives in ANOTHER repository, torarnehave1/calendar (public), which has no
# pipeline of its own. This job lives here because the approval gate lives here: the deploy job
# runs in the `mcp-production` environment, which has a required reviewer, and
# CLOUDFLARE_API_TOKEN exists ONLY as a secret of that environment. Never add it as a repository
# secret, here or in the calendar repository.
#
# Added 2026-11-16: until then calendar-worker was deployed by hand with wrangler. The route the
# VEGR Flow «Stillerom» needs (POST /api/calendar/events) was merged but could not be put out
# from a phone, which is where the owner works.
#
# It does not start by itself when the calendar repository changes (a push there is not an event
# here). Start it from Actions → this workflow → Run workflow. It also runs once when this file
# itself changes on main, which is how the first deploy starts.
name: Deploy calendar-worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-calendar-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-calendar-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: torarnehave1/calendar
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 1/3 unit tests
        run: node --test calendar-worker/test/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: mcp-production
    env:
      CLOUDFLARE_ACCOUNT_ID: 5d9b2060ef095c777711a8649c24914e
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: torarnehave1/calendar
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the Cloudflare token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Environment secret CLOUDFLARE_API_TOKEN is missing — gh secret set CLOUDFLARE_API_TOKEN --env mcp-production"
            exit 1
          fi

      - name: 2/3 deploy
        working-directory: calendar-worker
        run: npx --yes wrangler@4 deploy

      - name: 3/3 what is running now
        working-directory: calendar-worker
        run: npx --yes wrangler@4 deployments status

      # The worker is reached over service bindings; whether it also has a public workers.dev
      # address is not recorded anywhere. So this check can confirm, but it cannot fail the job.
      - name: Public check, if the worker has a public address (401 = the new route is there)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' https://calendar-worker.torarnehave.workers.dev/api/calendar/events || true)
          echo "HTTP $code"
          if [ "$code" = "401" ]; then
            echo "The new route answers."
          else
            echo "::warning::Could not confirm POST /api/calendar/events over a public address (HTTP $code). The deploy step above is what counts."
          fi
