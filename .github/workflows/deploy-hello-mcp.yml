# Deploys hello-mcp-worker on every push to main that touches it: unit tests → deploy → live smoke.
# The same gate as dev-worker/ship.sh, run by GitHub instead of a laptop.
#
# No wrangler.toml: the worker has no bindings or secrets, so name and compatibility date are
# passed as flags and the repo rule that *.toml stays out of git is untouched.
#
# Needs ONE repository secret: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit on the account below).
# The account id is not a secret.
name: Deploy hello-mcp-worker

on:
  push:
    branches: [main]
    paths:
      - 'hello-mcp-worker/**'
      - '.github/workflows/deploy-hello-mcp.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hello-mcp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 5d9b2060ef095c777711a8649c24914e
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 1/3 unit tests
        run: node --test hello-mcp-worker/test/*.test.mjs

      - name: Check the Cloudflare token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing — add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: 2/3 deploy
        # Run from a scratch dir so wrangler does not pick up the repo's root package.json/config.
        run: |
          mkdir -p "$RUNNER_TEMP/deploy" && cd "$RUNNER_TEMP/deploy"
          npx --yes wrangler@4 deploy "$GITHUB_WORKSPACE/hello-mcp-worker/index.js" \
            --name hello-mcp \
            --compatibility-date 2026-10-01

      - name: 3/3 live smoke
        run: node hello-mcp-worker/test/smoke-live.mjs
