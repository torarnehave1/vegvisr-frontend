# flows-worker — the VEGR Flows engine (2026-11-06). Binding names and ids only: no tokens,
# passwords, e-mail addresses or phone numbers (the repo is public). Deployed first through the
# Cloudflare API from a Claude session; `wrangler deploy` from this folder gives the same result.
name = "flows-worker"
main = "index.js"
compatibility_date = "2025-04-01"
account_id = "5d9b2060ef095c777711a8649c24914e"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "vegvisr_org"
database_id = "507d1efd-1dda-45ef-971f-52d2c8e8afe8"

# One FlowRunner instance per run; instance id = flow_runs.id. Retention 7 days on success,
# 30 on error (set on the workflow itself).
[[workflows]]
name = "flow-runner"
binding = "FLOW_RUNNER"
class_name = "FlowRunner"

# Live runs call MCP tools back on knowledge-graph-worker as the flow's owner
# (POST /internal/flows/call-tool, binding only; read-only tools only).
[[services]]
binding = "KG_WORKER"
service = "knowledge-graph-worker"
